suite: Upstream infisical-standalone wiring
templates:
  - charts/infisical-standalone/templates/infisical.yaml
  - charts/infisical-standalone/templates/ingress.yaml
  - charts/infisical-standalone/charts/ingress-nginx/templates/controller-deployment.yaml
release:
  name: infisical
  namespace: infisical
tests:
  - it: keeps the upstream Deployment name and selector labels from 1.10.0
    template: charts/infisical-standalone/templates/infisical.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: infisical-infisical-standalone-infisical
      - equal:
          path: spec.selector.matchLabels
          value: {component: infisical, app: infisical-standalone, release: infisical}
      - equal:
          path: spec.template.metadata.labels
          value: {component: infisical, app: infisical-standalone, release: infisical}
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value: [{secretRef: {name: infisical-bootstrap}}]

  - it: keeps the upstream Service name and selector
    template: charts/infisical-standalone/templates/infisical.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: infisical-infisical-standalone-infisical
      - equal:
          path: spec.selector
          value: {component: infisical, app: infisical-standalone, release: infisical}

  - it: renders no env entries by default
    template: charts/infisical-standalone/templates/infisical.yaml
    documentIndex: 0
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].env

  - it: passes extra env entries through unchanged
    template: charts/infisical-standalone/templates/infisical.yaml
    documentIndex: 0
    set:
      infisical-standalone.infisical.extraEnv:
        - name: SITE_URL
          value: https://infisical.example.test
        - name: SAMPLE_SETTING
          value: sample-value
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - {name: SITE_URL, value: https://infisical.example.test}
            - {name: SAMPLE_SETTING, value: sample-value}
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: infisical-bootstrap

  - it: renders no upstream Ingress by default
    template: charts/infisical-standalone/templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  # helm-unittest 0.3.1 cannot assert on a subchart its condition drops (the template is absent),
  # so this proves the condition gates ingress-nginx; the default-off render is checked by helm template in CI evidence.
  - it: renders the ingress-nginx controller when its condition is turned on
    set:
      infisical-standalone.ingress.nginx.enabled: true
    template: charts/infisical-standalone/charts/ingress-nginx/templates/controller-deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
