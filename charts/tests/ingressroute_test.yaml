suite: Infisical IngressRoute
templates:
  - templates/ingressroute.yaml
  - charts/infisical-standalone/templates/infisical.yaml
release:
  name: infisical
  namespace: infisical
tests:
  - it: renders no route by default
    template: templates/ingressroute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the host to the upstream Service with TLS and middlewares
    values:
      - ../ci/all-on-values.yaml
    template: templates/ingressroute.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: traefik.io/v1alpha1
      - isKind:
          of: IngressRoute
      - equal:
          path: metadata.name
          value: infisical-ingress
      - equal:
          path: metadata.namespace
          value: infisical
      - equal:
          path: metadata.annotations
          value: {kubernetes.io/ingress.class: traefik-external}
      - equal:
          path: spec.entryPoints
          value: [websecure]
      - equal:
          path: spec.routes
          value:
            - match: Host(`infisical.example.test`)
              kind: Rule
              middlewares: [{name: default-headers, namespace: default}]
              services: [{name: infisical-infisical-standalone-infisical, port: 8080}]
      - equal:
          path: spec.tls
          value: {secretName: fake-infisical-tls}

  - it: adds no middlewares when none are configured
    set:
      ingressRoute.enabled: true
      ingressRoute.host: infisical.example.test
      ingressRoute.tlsSecretName: fake-infisical-tls
    template: templates/ingressroute.yaml
    asserts:
      - isNull:
          path: spec.routes[0].middlewares

  - it: uses the configured entry points and ingress class
    values:
      - ../ci/all-on-values.yaml
    set:
      ingressRoute.entryPoints: [internal-tls]
      ingressRoute.ingressClass: internal-controller
    template: templates/ingressroute.yaml
    asserts:
      - equal:
          path: spec.entryPoints
          value: [internal-tls]
      - equal:
          path: metadata.annotations["kubernetes.io/ingress.class"]
          value: internal-controller

  - it: follows the upstream Service name under a custom fullnameOverride
    values:
      - ../ci/all-on-values.yaml
    set:
      infisical-standalone.infisical.fullnameOverride: custom-infisical
    asserts:
      - equal:
          path: spec.routes[0].services[0]
          value: {name: custom-infisical, port: 8080}
        template: templates/ingressroute.yaml
      - isKind:
          of: Service
        template: charts/infisical-standalone/templates/infisical.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: custom-infisical
        template: charts/infisical-standalone/templates/infisical.yaml
        documentIndex: 1
