suite: Bootstrap key generation hooks
templates:
  - templates/bootstrap-keys-job.yaml
release:
  name: infisical
  namespace: infisical
tests:
  - it: renders no hook objects by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no hook objects when only an existing Secret is named
    set:
      bootstrap.existingSecret: custom-bootstrap
      infisical-standalone.infisical.kubeSecretRef: custom-bootstrap
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the four hook objects in order when generateKeys is on
    set:
      bootstrap.generateKeys: true
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - isKind:
          of: Role
        documentIndex: 1
      - isKind:
          of: RoleBinding
        documentIndex: 2
      - isKind:
          of: Job
        documentIndex: 3
      - equal:
          path: metadata.name
          value: infisical-bootstrap-keys
      - equal:
          path: metadata.namespace
          value: infisical

  - it: puts both Helm and Argo CD hook annotations on every RBAC object with weight -10
    set:
      bootstrap.generateKeys: true
    asserts:
      - equal:
          path: metadata.annotations
          value: &rbacHooks
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
            argocd.argoproj.io/hook: PreSync
            argocd.argoproj.io/sync-wave: "-10"
            argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
        documentIndex: 0
      - equal:
          path: metadata.annotations
          value: *rbacHooks
        documentIndex: 1
      - equal:
          path: metadata.annotations
          value: *rbacHooks
        documentIndex: 2

  - it: puts both Helm and Argo CD hook annotations on the Job with weight -5
    set:
      bootstrap.generateKeys: true
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.annotations
          value:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-5"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
            argocd.argoproj.io/hook: PreSync
            argocd.argoproj.io/sync-wave: "-5"
            argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded

  - it: limits the Role to get on the bootstrap Secret and an unrestricted create
    set:
      bootstrap.generateKeys: true
    documentIndex: 1
    asserts:
      - lengthEqual:
          path: rules
          count: 2
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              resourceNames: [infisical-bootstrap]
              verbs: [get]
            - apiGroups: [""]
              resources: [secrets]
              verbs: [create]
      - isNull:
          path: rules[1].resourceNames
      - notContains:
          path: rules[0].verbs
          content: update
      - notContains:
          path: rules[0].verbs
          content: patch
      - notContains:
          path: rules[0].verbs
          content: delete
      - notContains:
          path: rules[1].verbs
          content: update
      - notContains:
          path: rules[1].verbs
          content: patch
      - notContains:
          path: rules[1].verbs
          content: delete

  - it: binds the Role to the hook ServiceAccount
    set:
      bootstrap.generateKeys: true
    documentIndex: 2
    asserts:
      - equal:
          path: roleRef
          value: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: infisical-bootstrap-keys}
      - equal:
          path: subjects
          value: [{kind: ServiceAccount, name: infisical-bootstrap-keys, namespace: infisical}]

  - it: runs the exact create-if-missing script with the pinned image
    set:
      bootstrap.generateKeys: true
    documentIndex: 3
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: infisical-bootstrap-keys
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[0].image
          value: alpine/k8s:1.30.14@sha256:3c6d1e613d94f03d63a6213b8687c7d4e5b9154903327aa8f0b5d628d7ab010b
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/bin/sh", "-c"]
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - |
              set -eu
              existing="$(kubectl get secret "$NAME" -n "$NS" --ignore-not-found -o name --request-timeout=20s)"
              [ -z "$existing" ] || exit 0
              ENCRYPTION_KEY="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
              AUTH_SECRET="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
              [ "${#ENCRYPTION_KEY}" -eq 32 ]
              [ "${#AUTH_SECRET}" -eq 44 ]
              if kubectl create secret generic "$NAME" -n "$NS" --from-literal=ENCRYPTION_KEY="$ENCRYPTION_KEY" --from-literal=AUTH_SECRET="$AUTH_SECRET" --request-timeout=20s; then exit 0; fi
              existing="$(kubectl get secret "$NAME" -n "$NS" --ignore-not-found -o name --request-timeout=20s)"
              [ -n "$existing" ]
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: uses the configured existing Secret name when both are set
    set:
      bootstrap.generateKeys: true
      bootstrap.existingSecret: custom-bootstrap
      infisical-standalone.infisical.kubeSecretRef: custom-bootstrap
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: NAME, value: custom-bootstrap}
        documentIndex: 3
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: NS, value: infisical}
        documentIndex: 3
      - equal:
          path: rules[0].resourceNames
          value: [custom-bootstrap]
        documentIndex: 1
