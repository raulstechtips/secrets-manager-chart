suite: SMTP InfisicalStaticSecret
templates:
  - templates/smtp-secret.yaml
release:
  name: infisical
  namespace: infisical
tests:
  - it: renders nothing when smtp is off
    asserts:
      - hasDocuments:
          count: 0

  - it: syncs the SMTP Secret from the configured path and auth
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: secrets.infisical.com/v1beta1
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: infisical-smtp-secret
      - equal:
          path: metadata.namespace
          value: infisical
      - equal:
          path: spec.infisicalAuthRef
          value: {name: fake-auth, namespace: fake-auth-namespace}
      - equal:
          path: spec.syncOptions
          value: {refreshInterval: 60s}
      - equal:
          path: spec.sources
          value:
            - projectSlug: fake-project
              environmentSlug: fake-env
              secretPath: /infisical/fake-smtp
      - lengthEqual:
          path: spec.targets
          count: 1
      - equal:
          path: spec.targets[0].name
          value: infisical-smtp-secret
      - equal:
          path: spec.targets[0].namespace
          value: infisical
      - equal:
          path: spec.targets[0].kind
          value: Secret
      - equal:
          path: spec.targets[0].creationPolicy
          value: Owner
      - equal:
          path: spec.targets[0].metadata
          value: {annotations: {}, labels: {}}
      - equal:
          path: spec.targets[0].template
          value:
            engineVersion: v1
            data:
              SMTP_FROM_ADDRESS: "{{ .SMTP_FROM_ADDRESS.Value }}"
              SMTP_FROM_NAME: "{{ .SMTP_FROM_NAME.Value }}"
              SMTP_HELO_HOST: "{{ .SMTP_HELO_HOST.Value }}"
              SMTP_HOST: "{{ .SMTP_HOST.Value }}"
              SMTP_PASSWORD: "{{ .SMTP_PASSWORD.Value }}"
              SMTP_USERNAME: "{{ .SMTP_USERNAME.Value }}"

  - it: keeps the other five keys when one key is overridden
    values:
      - ../ci/all-on-values.yaml
    set:
      smtp.keys.SMTP_HOST: CUSTOM_SMTP_HOST
    asserts:
      - equal:
          path: spec.targets[0].template.data
          value:
            SMTP_FROM_ADDRESS: "{{ .SMTP_FROM_ADDRESS.Value }}"
            SMTP_FROM_NAME: "{{ .SMTP_FROM_NAME.Value }}"
            SMTP_HELO_HOST: "{{ .SMTP_HELO_HOST.Value }}"
            SMTP_HOST: "{{ .CUSTOM_SMTP_HOST.Value }}"
            SMTP_PASSWORD: "{{ .SMTP_PASSWORD.Value }}"
            SMTP_USERNAME: "{{ .SMTP_USERNAME.Value }}"

  - it: uses a custom Secret name for the object and its target
    values:
      - ../ci/all-on-values.yaml
    set:
      smtp.secretName: custom-smtp
      infisical-standalone.infisical.extraEnv:
        - name: SITE_URL
          valueFrom: {configMapKeyRef: {name: infisical-config, key: SITE_URL}}
        - name: SMTP_HOST
          valueFrom: {secretKeyRef: {name: custom-smtp, key: SMTP_HOST, optional: true}}
    asserts:
      - equal:
          path: metadata.name
          value: custom-smtp
      - equal:
          path: spec.targets[0].name
          value: custom-smtp
