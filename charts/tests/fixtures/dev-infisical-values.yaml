# Dev values for the infisical wrapper chart (ghcr.io/raulstechtips/charts/infisical).
# No secret values here: the root keys live in Secret infisical-bootstrap (created by hand from NordPass).
# Public site URL, served through the ConfigMap infisical-config.
siteUrl: https://infisical.prod.raulstechtips.dev
bootstrap:
  existingSecret: infisical-bootstrap
# Infisical connection for the optional SMTP secret sync (shared auth from DEVSECOPS-153).
infisical:
  authRef:
    name: infisical-prod-universal-auth
    namespace: default
  projectSlug: k3s-ntpo
  environmentSlug: prod
smtp:
  enabled: true
ingressRoute:
  enabled: true
  host: infisical.prod.raulstechtips.dev
  tlsSecretName: prod-raulstechtips-tls
  middlewares:
    - name: default-headers
      namespace: default
# Values for the upstream chart (used as-is, no alias).
infisical-standalone:
  infisical:
    replicaCount: 2
    image:
      # Private build carrying the enterprise options.
      repository: ghcr.io/raulstechtips/secrets-manager
      tag: "v0.162.21-prod.1"
      imagePullSecrets:
        - name: github-registry-secret
    kubeSecretRef: infisical-bootstrap
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - infisical-standalone
            topologyKey: kubernetes.io/hostname
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - infisical-standalone
              topologyKey: kubernetes.io/hostname
    resources:
      limits:
        memory: 1000Mi
        cpu: 200m
      requests:
        cpu: 10m
        memory: 100Mi
    extraVolumes:
      - name: postgres-ca-cert
        secret:
          secretName: raulstechtips-internal-ca-key-pair
          items:
            - key: ca.crt
              path: postgres-ca.crt
    extraVolumeMounts:
      - name: postgres-ca-cert
        mountPath: /etc/custom-certs
        readOnly: true
    # Lists replace wholesale, so this is the full env list for the pod.
    extraEnv:
      - name: SITE_URL
        valueFrom:
          configMapKeyRef:
            name: infisical-config
            key: SITE_URL
      # The private build reports usage upstream by default.
      - name: TELEMETRY_ENABLED
        value: "false"
      # Private IP address not allowed for relay, have to set this variable.
      - name: ALLOW_INTERNAL_IP_CONNECTIONS
        value: "true"
      - name: DB_HOST
        value: pg-prod-rw.prod.svc.cluster.local
      - name: DB_PORT
        value: "5432"
      - name: DB_NAME
        value: pg-infisical
      - name: DB_USER
        value: infisical-pg-admin
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pg-infisical-database-credentials-secret
            key: password
      - name: DB_SSL_ROOT_CERT
        value: /etc/custom-certs/postgres-ca.crt
      - name: DB_CONNECTION_URI
        value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=verify-ca&sslrootcert=$(DB_SSL_ROOT_CERT)
      - name: REDIS_HOST
        value: redis-infisical-master.infisical.svc.cluster.local
      - name: REDIS_PORT
        value: "6379"
      - name: REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: infisical-redis-admin-credentials-secret
            key: redis-password
      - name: REDIS_URL
        value: redis://default:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)
      - name: SMTP_HOST
        valueFrom:
          secretKeyRef:
            name: infisical-smtp-secret
            key: SMTP_HOST
            optional: true
      - name: SMTP_USERNAME
        valueFrom:
          secretKeyRef:
            name: infisical-smtp-secret
            key: SMTP_USERNAME
            optional: true
      - name: SMTP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: infisical-smtp-secret
            key: SMTP_PASSWORD
            optional: true
      - name: SMTP_FROM_ADDRESS
        valueFrom:
          secretKeyRef:
            name: infisical-smtp-secret
            key: SMTP_FROM_ADDRESS
            optional: true
      - name: SMTP_FROM_NAME
        valueFrom:
          secretKeyRef:
            name: infisical-smtp-secret
            key: SMTP_FROM_NAME
            optional: true
      - name: SMTP_HELO_HOST
        valueFrom:
          secretKeyRef:
            name: infisical-smtp-secret
            key: SMTP_HELO_HOST
            optional: true
  postgresql:
    enabled: false
  redis:
    enabled: false
  ingress:
    enabled: false
    nginx:
      enabled: false
