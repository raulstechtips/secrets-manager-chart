suite: Infisical config map
templates:
  - templates/configmap.yaml
release:
  name: infisical
  namespace: infisical
tests:
  - it: renders with no overrides and the upstream default site URL
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: infisical-config
      - equal:
          path: metadata.namespace
          value: infisical
      - equal:
          path: data
          value: {SITE_URL: "http://localhost:8080"}

  - it: renders the configured site URL
    set:
      siteUrl: https://infisical.example.test
    asserts:
      - equal:
          path: data.SITE_URL
          value: https://infisical.example.test

  - it: renders with every wrapper feature on
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - equal:
          path: data.SITE_URL
          value: https://infisical.example.test
