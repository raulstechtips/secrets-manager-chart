{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: infisical-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infisical-wrapper.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingressRoute.ingressClass | quote }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - match: {{ printf "Host(`%s`)" (required "ingressRoute.host is required when ingressRoute.enabled is true" .Values.ingressRoute.host) | quote }}
      kind: Rule
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "infisical.fullname" (index .Subcharts "infisical-standalone") }}
          port: 8080
  tls:
    secretName: {{ required "ingressRoute.tlsSecretName is required when ingressRoute.enabled is true" .Values.ingressRoute.tlsSecretName | quote }}
{{- end }}
