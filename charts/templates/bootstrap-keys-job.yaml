{{- if .Values.bootstrap.generateKeys }}
{{- /* Creates bootstrap.existingSecret ONLY when it is missing. Never updates, patches or deletes a Secret. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-bootstrap-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infisical-wrapper.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
# get is limited to the bootstrap Secret; create cannot be restricted by name in Kubernetes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infisical-bootstrap-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infisical-wrapper.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.bootstrap.existingSecret | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infisical-bootstrap-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infisical-wrapper.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infisical-bootstrap-keys
subjects:
  - kind: ServiceAccount
    name: infisical-bootstrap-keys
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: infisical-bootstrap-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infisical-wrapper.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "infisical-wrapper.labels" . | nindent 8 }}
    spec:
      serviceAccountName: infisical-bootstrap-keys
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: generate-keys
          image: {{ .Values.bootstrap.jobImage | quote }}
          env:
            - name: NAME
              value: {{ .Values.bootstrap.existingSecret | quote }}
            - name: NS
              value: {{ .Release.Namespace | quote }}
            # kubectl writes its discovery cache under $HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              existing="$(kubectl get secret "$NAME" -n "$NS" --ignore-not-found -o name --request-timeout=20s)"
              [ -z "$existing" ] || exit 0
              ENCRYPTION_KEY="$(openssl rand -hex 16)"
              AUTH_SECRET="$(openssl rand -base64 32)"
              if kubectl create secret generic "$NAME" -n "$NS" --from-literal=ENCRYPTION_KEY="$ENCRYPTION_KEY" --from-literal=AUTH_SECRET="$AUTH_SECRET" --request-timeout=20s; then exit 0; fi
              existing="$(kubectl get secret "$NAME" -n "$NS" --ignore-not-found -o name --request-timeout=20s)"
              [ -n "$existing" ]
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
